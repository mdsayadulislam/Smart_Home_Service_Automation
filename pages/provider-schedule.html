<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Partner Schedule — HomeEase Pro</title>
  <link rel="stylesheet" href="../assets/css/global.css"/>
  <link rel="stylesheet" href="../assets/css/dashboard.css"/>
  <link rel="stylesheet" href="../assets/css/profile.css"/>
  <link rel="stylesheet" href="../assets/css/provider.css"/>
  <link rel="stylesheet" href="../assets/css/provider-schedule.css"/>
</head>
<body class="dashboard-page">
<div class="app-shell">

  <!-- Header -->
  <header class="provider-top-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <a href="provider-dashboard.html" class="modal-close-btn" style="text-decoration:none;" aria-label="Go back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div style="font-size:17px; font-weight:800; color:var(--text-dark);">Daily Schedule</div>
    </div>
    <span class="pro-badge">CALENDAR</span>
  </header>

  <div class="page-scroll" style="padding-bottom:80px;">

    <!-- Working Hours Shift Card -->
    <div class="duty-shift-card">
      <div class="shift-top">
        <div>
          <div class="shift-title">Available Shift Hours</div>
          <span class="shift-hours">09:00 AM – 08:00 PM</span>
        </div>
        <div class="ps-toggle-track on" id="scheduleDutyToggle" role="switch" aria-checked="true" tabindex="0" title="Toggle Shift Availability">
          <div class="ps-toggle-thumb"></div>
        </div>
      </div>
    </div>

    <!-- Calendar Ribbon -->
    <div class="p-section-header" style="padding-bottom:8px;">
      <span class="p-section-title">September 2026</span>
      <span style="font-size:12px;color:var(--primary);font-weight:700;">Dhaka North Hub</span>
    </div>

    <div class="schedule-days-scroll">
      <!-- Day 1: Today -->
      <div class="s-day-chip active" data-day="Today">
        <div class="sd-day-name">TODAY</div>
        <div class="sd-day-num">08</div>
        <div class="sd-jobs-count">3 Jobs</div>
      </div>

      <!-- Day 2: Tomorrow -->
      <div class="s-day-chip" data-day="Tomorrow">
        <div class="sd-day-name">WED</div>
        <div class="sd-day-num">09</div>
        <div class="sd-jobs-count">2 Jobs</div>
      </div>

      <!-- Day 3: Thu -->
      <div class="s-day-chip" data-day="Upcoming">
        <div class="sd-day-name">THU</div>
        <div class="sd-day-num">10</div>
        <div class="sd-jobs-count">1 Job</div>
      </div>

      <!-- Day 4: Fri -->
      <div class="s-day-chip" data-day="Upcoming">
        <div class="sd-day-name">FRI</div>
        <div class="sd-day-num">11</div>
        <div class="sd-jobs-count">Open</div>
      </div>

      <!-- Day 5: Sat -->
      <div class="s-day-chip" data-day="Upcoming">
        <div class="sd-day-name">SAT</div>
        <div class="sd-day-num">12</div>
        <div class="sd-jobs-count">Open</div>
      </div>
    </div>

    <!-- Schedule Timeline Slots List -->
    <div class="timeline-slots-wrap" id="scheduleTimelineContainer">
      <!-- Populated dynamically by assets/js/provider-schedule.js -->
    </div>

  </div><!-- /page-scroll -->

  <!-- Provider Bottom Nav -->
  <nav class="bottom-nav">
    <a href="provider-dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span class="nav-label">Jobs</span>
    </a>
    <a href="provider-wallet.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
      <span class="nav-label">Wallet</span>
    </a>
    <a href="provider-schedule.html" class="nav-item active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="nav-label">Schedule</span>
    </a>
    <a href="login.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="nav-label">Log Out</span>
    </a>
  </nav>

</div>

<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<script src="../assets/js/provider-schedule.js"></script>
</body>
</html>
