<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — HomeEase Smart BD</title>
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/login.css" />
  <link rel="stylesheet" href="../assets/css/signup.css" />

  <style>
    /* Shake animation for invalid inputs */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* Spinner for submit button */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body>

  <!-- ════════════════════════════════════
       Phone / Card Shell
  ════════════════════════════════════ -->
  <main class="phone-card signup-card" role="main" aria-label="Sign up form">

    <!-- Role Toggle -->
    <nav class="role-toggle" aria-label="Account type">
      <button class="active" data-role="customer" aria-pressed="true">
        <!-- Person icon -->
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
        Customer
      </button>
      <button data-role="provider" aria-pressed="false">
        <!-- Wrench icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        Service Provider
      </button>
    </nav>

    <!-- Hero Logo -->
    <div class="hero-logo" aria-hidden="true">
      <div class="logo-ring-outer">
        <div class="logo-ring-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <path d="M9 21V12h6v9"/>
            <circle cx="12" cy="10" r="1.5" fill="#FF6B2C" stroke="none"/>
          </svg>
        </div>
        <span class="online-dot" title="Online"></span>
      </div>
    </div>

    <!-- Headings -->
    <h1 class="welcome-title">Create Account</h1>
    <p class="welcome-subtitle">
      Join HomeEase &mdash; trusted smart home services across BD
    </p>

    <!-- ── Sign Up Form ── -->
    <form id="signupForm" class="form-section" novalidate>

      <!-- Full Name Field -->
      <div class="field-group">
        <label class="field-label" for="fullNameInput">Full Name</label>
        <div class="input-wrap" id="fullNameWrap">
          <span class="input-icon" aria-hidden="true">
            <!-- Person icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            type="text"
            id="fullNameInput"
            name="fullName"
            placeholder="Your full name"
            autocomplete="name"
            aria-label="Full name"
            required
          />
        </div>
      </div>

      <!-- Mobile Number Field -->
      <div class="field-group">
        <label class="field-label" for="mobileInput">Mobile Number</label>
        <div class="input-wrap" id="mobileWrap">
          <span class="input-icon" aria-hidden="true">
            <!-- Phone icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.16 6.16l.91-.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <span class="phone-prefix" aria-label="+880 country code">+880</span>
          <input
            type="tel"
            id="mobileInput"
            name="mobile"
            placeholder="17XX-XXXXXX"
            autocomplete="tel"
            inputmode="tel"
            aria-label="Mobile number without country code"
            required
          />
        </div>
      </div>

      <!-- Email Field (Optional) -->
      <div class="field-group">
        <div class="field-label-row">
          <label class="field-label" for="emailInput">Email Address</label>
          <span class="optional-tag">Optional</span>
        </div>
        <div class="input-wrap" id="emailWrap">
          <span class="input-icon" aria-hidden="true">
            <!-- Mail icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input
            type="email"
            id="emailInput"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
            aria-label="Email address (optional)"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="field-group">
        <label class="field-label" for="passwordInput">Password</label>
        <div class="input-wrap" id="passwordWrap">
          <span class="input-icon" aria-hidden="true">
            <!-- Lock icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="passwordInput"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            aria-label="Password"
            required
          />
          <button type="button" class="input-action" id="passwordToggle" aria-label="Toggle password visibility">
            <svg id="eyeOpen1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <!-- Password Strength Indicator -->
        <div class="strength-bar-wrap" id="strengthBarWrap" aria-hidden="true">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <span class="strength-label" id="strengthLabel" aria-live="polite"></span>
      </div>

      <!-- Confirm Password Field -->
      <div class="field-group">
        <label class="field-label" for="confirmPasswordInput">Confirm Password</label>
        <div class="input-wrap" id="confirmWrap">
          <span class="input-icon" aria-hidden="true">
            <!-- Lock icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="confirmPasswordInput"
            name="confirmPassword"
            placeholder="Repeat your password"
            autocomplete="new-password"
            aria-label="Confirm password"
            required
          />
          <button type="button" class="input-action" id="confirmToggle" aria-label="Toggle confirm password visibility">
            <svg id="eyeOpen2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Terms & Conditions Checkbox -->
      <div class="terms-row" id="termsWrap">
        <label class="terms-label">
          <input type="checkbox" id="termsCheck" name="terms" aria-required="true" />
          <span class="terms-check-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span class="terms-text">
            I agree to the
            <a href="#" class="terms-link">Terms of Service</a>
            and
            <a href="#" class="terms-link">Privacy Policy</a>
          </span>
        </label>
      </div>

      <!-- Create Account Button -->
      <button type="submit" class="login-btn" id="signupBtn">
        Create Account
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

      <!-- Divider -->
      <div class="divider" role="separator"><span>or sign up with</span></div>

      <!-- Social Sign-Up -->
      <div class="social-row" role="group" aria-label="Social sign-up options">

        <!-- Google -->
        <button type="button" class="social-btn" data-provider="google" aria-label="Sign up with Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </button>

        <!-- SMS / OTP -->
        <button type="button" class="social-btn" data-provider="sms" aria-label="Sign up with SMS OTP" style="color:#3B2FC9;">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z"/>
          </svg>
        </button>

        <!-- Facebook -->
        <button type="button" class="social-btn" data-provider="facebook" aria-label="Sign up with Facebook">
          <svg viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
            <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          </svg>
        </button>

      </div>

      <!-- Footer — Log In link -->
      <p class="signup-footer">
        Already have an account?&nbsp;<a href="login.html">Log In</a>
      </p>

    </form>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="../assets/js/signup.js"></script>
</body>
</html>
