<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Partner Wallet — HomeEase Pro</title>
  <link rel="stylesheet" href="../assets/css/global.css"/>
  <link rel="stylesheet" href="../assets/css/dashboard.css"/>
  <link rel="stylesheet" href="../assets/css/profile.css"/>
  <link rel="stylesheet" href="../assets/css/provider.css"/>
  <link rel="stylesheet" href="../assets/css/provider-wallet.css"/>
</head>
<body class="dashboard-page">
<div class="app-shell">

  <!-- Header -->
  <header class="provider-top-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <a href="provider-dashboard.html" class="modal-close-btn" style="text-decoration:none;" aria-label="Go back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div style="font-size:17px; font-weight:800; color:var(--text-dark);">Partner Wallet</div>
    </div>
    <span class="pro-badge">PAYOUTS</span>
  </header>

  <div class="page-scroll" style="padding-bottom:80px;">

    <!-- Wallet Balance Card -->
    <div class="wallet-hero-card">
      <div class="wallet-top-meta">
        <span class="wallet-lbl">Available Balance</span>
        <span class="wallet-badge-verified">
          ✓ Verified Partner
        </span>
      </div>

      <div class="wallet-balance-row">
        <div class="wallet-balance-val" id="walletBalDisplay">৳14,250</div>
      </div>

      <div class="wallet-btn-row">
        <button class="wallet-btn wallet-btn-withdraw" onclick="openWithdrawModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
          Cashout Funds
        </button>
        <button class="wallet-btn wallet-btn-bank" onclick="showToast('💳 Bank Account is already linked with Dhaka Bank (A/C: •••• 8812)')">
          Bank Linked
        </button>
      </div>
    </div>

    <!-- 3-Column Metrics -->
    <div class="earnings-grid-3">
      <div class="eg-col">
        <div class="eg-num">৳3,450</div>
        <div class="eg-lbl">Today</div>
      </div>
      <div class="eg-col">
        <div class="eg-num">৳18,200</div>
        <div class="eg-lbl">This Week</div>
      </div>
      <div class="eg-col">
        <div class="eg-num">৳62,400</div>
        <div class="eg-lbl">This Month</div>
      </div>
    </div>

    <!-- Primary Payout Method -->
    <div class="payout-method-box">
      <div class="pm-left">
        <div class="pm-logo">bK</div>
        <div>
          <div class="pm-name">bKash Personal Wallet</div>
          <div class="pm-account">+880 1733-••••66 &bull; Instant Cashout</div>
        </div>
      </div>
      <span class="primary-tag" style="background:#FFF;border-color:#FDBA74;color:#C2410C;">Primary</span>
    </div>

    <!-- Transaction History -->
    <div class="p-section-header" style="padding-top:6px;">
      <span class="p-section-title">
        Recent Activity &amp; Payouts
      </span>
      <span style="font-size:12px;color:var(--primary);font-weight:700;">Live Ledger</span>
    </div>

    <div class="trx-list" id="trxList">
      <!-- Populated dynamically by assets/js/provider-wallet.js -->
    </div>

  </div><!-- /page-scroll -->

  <!-- Provider Bottom Nav -->
  <nav class="bottom-nav">
    <a href="provider-dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span class="nav-label">Jobs</span>
    </a>
    <a href="provider-wallet.html" class="nav-item active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
      <span class="nav-label">Wallet</span>
    </a>
    <a href="provider-schedule.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="nav-label">Schedule</span>
    </a>
    <a href="login.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="nav-label">Log Out</span>
    </a>
  </nav>

</div>

<!-- Cashout Bottom Sheet Modal -->
<div class="modal-overlay" id="withdrawModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header-row">
      <div class="modal-title">Cashout Funds to Wallet</div>
      <button class="modal-close-btn" onclick="closeWithdrawModal()">✕</button>
    </div>
    <form id="withdrawForm">
      <div class="modal-form-group">
        <label class="modal-label">Payout Channel</label>
        <select id="withdrawMethod" class="modal-input" style="background:#fff;">
          <option value="bKash">bKash Mobile Wallet</option>
          <option value="Nagad">Nagad Wallet</option>
          <option value="Rocket">Rocket (DBBL)</option>
          <option value="Bank Transfer">Bank Wire (Dhaka Bank •••• 8812)</option>
        </select>
      </div>
      <div class="modal-form-group">
        <label class="modal-label">Receiver Account Number</label>
        <input type="tel" id="withdrawAccountNum" class="modal-input" value="01733445566" required />
      </div>
      <div class="modal-form-group">
        <label class="modal-label">Withdrawal Amount (৳ BDT)</label>
        <input type="number" id="withdrawAmount" class="modal-input" placeholder="e.g. 3000" min="100" required />
      </div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button type="button" onclick="document.getElementById('withdrawAmount').value=1000" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:12px;cursor:pointer;">৳1,000</button>
        <button type="button" onclick="document.getElementById('withdrawAmount').value=3000" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:12px;cursor:pointer;">৳3,000</button>
        <button type="button" onclick="document.getElementById('withdrawAmount').value=5000" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:12px;cursor:pointer;">৳5,000</button>
      </div>
      <button type="submit" class="modal-btn-submit" style="background:#22C55E;">Confirm &amp; Transfer Payout →</button>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<script src="../assets/js/provider-wallet.js"></script>
</body>
</html>
